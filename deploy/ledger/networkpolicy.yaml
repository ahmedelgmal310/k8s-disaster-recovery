# PostgreSQL only accepts connections from the ledger API and other instances
# of the same cluster, plus the operator's status checks. Velero restores
# these policies together with the rest of the namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pg-ingress
  namespace: ledger
  labels:
    app.kubernetes.io/part-of: ledger
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: pg
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: ledger-api
        - podSelector:
            matchLabels:
              cnpg.io/cluster: pg
      ports:
        - port: 5432
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - port: 8000
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9187
---
# The API is the public entry point: HTTP from anywhere in the cluster,
# nothing else.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-api-ingress
  namespace: ledger
  labels:
    app.kubernetes.io/part-of: ledger
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledger-api
  policyTypes: ["Ingress"]
  ingress:
    - ports:
        - port: 8080
