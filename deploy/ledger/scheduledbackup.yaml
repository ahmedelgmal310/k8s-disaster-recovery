# Daily base backup at 02:00 UTC (CNPG cron has a seconds field).
# WAL is archived continuously in between, so any point since the oldest
# retained base backup can be recovered.
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: pg-daily
  namespace: ledger
  labels:
    app.kubernetes.io/part-of: ledger
spec:
  schedule: "0 0 2 * * *"
  backupOwnerReference: self
  cluster:
    name: pg
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
