# In-cluster name for the object store, which runs outside every Kubernetes
# cluster (a container on the kind Docker network) so it survives the loss of
# a whole cluster. Rendered with envsubst: S3_IP.
apiVersion: v1
kind: Namespace
metadata:
  name: storage
---
apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: storage
spec:
  ports:
    - name: http
      port: 8333
      targetPort: 8333
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: s3-external
  namespace: storage
  labels:
    kubernetes.io/service-name: s3
addressType: IPv4
ports:
  - name: http
    port: 8333
    protocol: TCP
endpoints:
  - addresses: ["${S3_IP}"]
    conditions:
      ready: true
