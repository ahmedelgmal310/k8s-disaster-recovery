name: DR drills

# Backups you never restore are not backups: every change to main, and every
# Monday, runs all three disaster-recovery drills end to end. A missed RTO or
# RPO target, a lost row or a corrupted file fails the run.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dr-drills-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HELM_VERSION: v4.3.1
  KIND_VERSION: v0.33.0
  KUBECTL_VERSION: v1.36.4
  VELERO_CLI_VERSION: v1.18.4
  VELERO_CLI_SHA256: e520c17d8997e1c9d0a28ae013592e4473ca3bd82cb3acd132e51286263f74bf
  PRIMARY: dr-primary
  STANDBY: dr-standby

jobs:
  drills:
    name: Namespace loss, bad DELETE (PITR), full cluster loss
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - name: Build ledger-api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ledger-api:ci
          cache-from: type=gha,scope=ledger-api

      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
        with:
          version: ${{ env.KIND_VERSION }}
          kubectl_version: ${{ env.KUBECTL_VERSION }}
          install_only: true
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Install Velero CLI
        run: |
          curl -fsSLo /tmp/velero.tgz \
            "https://github.com/vmware-tanzu/velero/releases/download/${VELERO_CLI_VERSION}/velero-${VELERO_CLI_VERSION}-linux-amd64.tar.gz"
          echo "${VELERO_CLI_SHA256}  /tmp/velero.tgz" | sha256sum -c -
          tar -xzf /tmp/velero.tgz -C /tmp
          sudo install -m 0755 "/tmp/velero-${VELERO_CLI_VERSION}-linux-amd64/velero" /usr/local/bin/velero
          velero version --client-only

      - name: Create break-glass secrets (random per run, never stored)
        run: ./dr/secrets.sh

      - name: Primary cluster + object store
        run: ./dr/cluster-up.sh "$PRIMARY"
      - name: Platform (cert-manager, CloudNativePG, Barman Cloud plugin, Velero)
        run: ./dr/platform.sh
      - name: Deploy ledger (PostgreSQL + API), first base backup
        run: ./dr/deploy-app.sh
      - name: Alert inputs are live metrics
        run: ./dr/verify-metrics.sh

      - name: "Drill 1: namespace deleted -> Velero restore"
        run: ./dr/drill-1-namespace.sh
      - name: "Drill 2: DELETE without WHERE -> point-in-time recovery"
        run: ./dr/drill-2-pitr.sh
      - name: "Drill 3: cluster lost -> rebuild from the object store"
        run: ./dr/drill-3-cluster.sh "$PRIMARY" "$STANDBY"
      - name: Backups at rest are encrypted
        run: ./dr/verify-encryption.sh

      - name: Report
        if: always()
        run: ./dr/report.sh

      - name: Diagnostics
        if: failure()
        run: |
          set +e
          kubectl config current-context
          kubectl get nodes -o wide
          kubectl get pods -A -o wide
          kubectl get clusters.postgresql.cnpg.io,backups.postgresql.cnpg.io,objectstores.barmancloud.cnpg.io -A
          kubectl describe clusters.postgresql.cnpg.io -n ledger
          kubectl get events -A --sort-by=.lastTimestamp | tail -80
          kubectl -n cnpg-system logs deploy/cnpg-controller-manager --tail=80
          kubectl -n cnpg-system logs deploy/barman-cloud --tail=60
          for p in $(kubectl -n ledger get pods -o name); do
            echo "--- $p"; kubectl -n ledger logs "$p" --all-containers --tail=60
          done
          velero backup get
          velero restore get
          kubectl -n velero logs deploy/velero --tail=80
          docker logs --tail 60 dr-s3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: dr-results
          path: dr-results/
          retention-days: 90
          if-no-files-found: ignore
